# The checks a contributor runs before a push, on every push and pull request.
# The live benchmarks (test/live/) need Codex and Claude sign-ins and stay local, in scripts/hooks/pre-push.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a pull request replaces the run before it; a run on main is never cancelled.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # Node 22.16 and 24: the first releases whose node:sqlite has FTS5 (not 22.13-22.15, not 23).
      # A pull request runs Linux on both and macOS on one; main runs all four. The second macOS job took
      # 25 to 35 minutes and in the runs of 16 November found nothing the other three had not.
      matrix:
        include: ${{ fromJSON(github.event_name == 'pull_request' && '[{"os":"ubuntu-latest","node":"22.16"},{"os":"ubuntu-latest","node":"24"},{"os":"macos-latest","node":"24"}]' || '[{"os":"ubuntu-latest","node":"22.16"},{"os":"ubuntu-latest","node":"24"},{"os":"macos-latest","node":"22.16"},{"os":"macos-latest","node":"24"}]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Git identity for the brains the tests commit to
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.com"
          git config --global init.defaultBranch main
      - name: Test suite
        run: node --test 'plugins/gtm-brain/test/*.test.mjs'
      - name: Derived text and schema in sync
        run: node scripts/sync-derived.mjs --check

  # A pull request into main that changes what ships (plugins/gtm-brain/, test/ aside) bumps the version.
  # Release branches carry their version already, so PRs into them are not checked.
  version:
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22.16"
      - name: Version bumped when shipped files change
        env:
          BASE: ${{ github.base_ref }}
        run: node scripts/check-version-bump.mjs "origin/$BASE"

  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.16"
          cache: npm
          cache-dependency-path: frontend/dashboard/package-lock.json
      - run: npm ci --prefix frontend/dashboard
      - run: npm run build --prefix frontend/dashboard
      - name: Committed dashboard assets match the source
        run: |
          drift="$(git status --porcelain plugins/gtm-brain/scripts/gtm-brain-render/ui/)"
          [ -z "$drift" ] || { echo "$drift"; echo "Rebuild the dashboard: npm run build --prefix frontend/dashboard, then commit plugins/gtm-brain/scripts/gtm-brain-render/ui/"; exit 1; }

  # The dashboard in headless Chromium (docs/SETUP.md, Checking the dashboard in a browser). Informational: a
  # failure shows on the run but does not fail it, and the job stops after five minutes.
  dashboard-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/dashboard/package-lock.json
      - run: npm ci --prefix frontend/dashboard
      - run: npm run test:e2e:install --prefix frontend/dashboard -- --with-deps
      - run: npm run test:e2e --prefix frontend/dashboard
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: dashboard-browser-results
          path: frontend/dashboard/.e2e/results/
          retention-days: 7

<svg xmlns="http://www.w3.org/2000/svg" viewBox="-20 -22 1020 566" role="img" aria-label="Left to right: configuration on the left shapes entities and memories in the middle; Codex, the grey box, is where you talk and is the only thing that reads your tools, on the right, and saves into the brain; notes and entities keep links back to the tools; workflows sit underneath and act through the tools under the rules." font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<rect x="-20" y="-22" width="1020" height="566" rx="14" fill="#ffffff"/>
      <defs>
        <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2126"/></marker>
        <marker id="arrW" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a4fbf"/></marker>
        <marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b03a5b"/></marker>
        <marker id="arrC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4c5bd4"/></marker>
      </defs>
      <!-- 1 configuration, left -->
      <text x="70" y="12" text-anchor="middle" font-size="11.5" font-weight="600" fill="#b03a5b">You edit the file</text>
      <path d="M70 18 L70 38" stroke="#b03a5b" stroke-width="1.6" fill="none" marker-end="url(#arrA)"/>
      <path d="M690 138 L690 26 L160 26 L160 38" stroke="#b03a5b" stroke-width="1.5" stroke-dasharray="5 4" fill="none" marker-end="url(#arrA)"/>
      <text x="420" y="19" text-anchor="middle" font-size="11.5" font-weight="600" fill="#b03a5b">You ask in chat: Codex proposes the change, you approve it</text>
      <rect x="20" y="40" width="190" height="320" rx="10" fill="#4c5bd4" fill-opacity=".12" stroke="#4c5bd4" stroke-width="1.5"/>
      <text x="115" y="68" text-anchor="middle" font-size="15" font-weight="600" fill="#4c5bd4">1 · Configuration</text>
      <text x="115" y="100" text-anchor="middle" font-size="12" font-weight="600" fill="#1d2126">about-us/</text>
      <text x="115" y="122" text-anchor="middle" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#1d2126">strategy · icp · market</text>
      <text x="115" y="142" text-anchor="middle" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#1d2126">voice · design-system</text>
      <text x="115" y="184" text-anchor="middle" font-size="12" font-weight="600" fill="#1d2126">config/</text>
      <text x="115" y="206" text-anchor="middle" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#1d2126">rules.md · schema.md</text>
      <text x="115" y="226" text-anchor="middle" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#1d2126">settings.yaml</text>
      <text x="115" y="322" text-anchor="middle" font-size="11.5" opacity=".7" fill="#1d2126">what is allowed,</text>
      <text x="115" y="338" text-anchor="middle" font-size="11.5" opacity=".7" fill="#1d2126">where things go</text>
      <!-- 2 entities, 3 memories, middle -->
      <rect x="300" y="40" width="240" height="130" rx="10" fill="#1f8a6a" fill-opacity=".12" stroke="#1f8a6a" stroke-width="1.5"/>
      <text x="420" y="68" text-anchor="middle" font-size="15" font-weight="600" fill="#1f8a6a">2 · Entities</text>
      <text x="420" y="92" text-anchor="middle" font-size="12.5" fill="#1d2126">people, organizations, tools,</text>
      <text x="420" y="112" text-anchor="middle" font-size="12.5" fill="#1d2126">meetings, events, offerings</text>
      
      <rect x="300" y="230" width="240" height="130" rx="10" fill="#c27a12" fill-opacity=".12" stroke="#c27a12" stroke-width="1.5"/>
      <text x="420" y="258" text-anchor="middle" font-size="15" font-weight="600" fill="#c27a12">3 · Memories</text>
      <text x="420" y="282" text-anchor="middle" font-size="12.5" fill="#1d2126">notes, decisions, questions</text>
      <text x="420" y="302" text-anchor="middle" font-size="12.5" fill="#1d2126">never edited, each with its source</text>
      
      <text x="420" y="344" text-anchor="middle" font-size="11" opacity=".7" fill="#1d2126">found through a search index</text>
      <!-- configuration shapes both -->
      <path d="M210 100 L298 100" stroke="#4c5bd4" stroke-width="1.6" fill="none" marker-end="url(#arrC)"/>
      <text x="254" y="80" text-anchor="middle" font-size="11" fill="#1d2126">fields, kinds,</text><text x="254" y="93" text-anchor="middle" font-size="11" fill="#1d2126">link types</text>
      <path d="M210 300 L298 300" stroke="#4c5bd4" stroke-width="1.6" fill="none" marker-end="url(#arrC)"/>
      <text x="254" y="280" text-anchor="middle" font-size="11" fill="#1d2126">checks</text><text x="254" y="293" text-anchor="middle" font-size="11" fill="#1d2126">every save</text>
      <!-- memories feed entities -->
      <path d="M420 228 L420 172" stroke="#1d2126" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
      <text x="430" y="204" text-anchor="start" font-size="11.5" fill="#1d2126">names resolve, links derive</text>
      <!-- Codex, the grey box -->
      <rect x="620" y="140" width="140" height="120" rx="10" fill="#1d2126" fill-opacity=".10" stroke="#1d2126" stroke-opacity=".55" stroke-width="1.5"/>
      <text x="690" y="168" text-anchor="middle" font-size="15" font-weight="600" fill="#1d2126">Codex</text>
      <text x="690" y="190" text-anchor="middle" font-size="12.5" fill="#1d2126">where you talk</text>
      <text x="690" y="212" text-anchor="middle" font-size="11.5" opacity=".8" fill="#1d2126">it reads, saves</text>
      <text x="690" y="228" text-anchor="middle" font-size="11.5" opacity=".8" fill="#1d2126">and acts for you</text>
      <text x="690" y="248" text-anchor="middle" font-size="10.5" opacity=".65" fill="#1d2126">nothing else writes</text>
      <!-- brain <-> Codex -->
      <path d="M542 110 L618 165" stroke="#1d2126" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
      <text x="590" y="122" text-anchor="start" font-size="11.5" fill="#1d2126">reads</text>
      <path d="M618 235 L542 290" stroke="#1d2126" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
      <text x="590" y="282" text-anchor="start" font-size="11.5" fill="#1d2126">saves</text>
      <!-- tools, right -->
      <rect x="820" y="40" width="140" height="320" rx="10" fill="none" stroke="#1d2126" stroke-opacity=".35" stroke-dasharray="5 4"/>
      <text x="890" y="68" text-anchor="middle" font-size="14" font-weight="600" fill="#1d2126">Your tools</text>
      <text x="890" y="86" text-anchor="middle" font-size="11" opacity=".7" fill="#1d2126">raw lives here</text>
      <text x="890" y="116" text-anchor="middle" font-size="12.5" opacity=".85" fill="#1d2126">HubSpot · Attio</text>
      <text x="890" y="138" text-anchor="middle" font-size="12.5" opacity=".85" fill="#1d2126">Gmail · Calendar</text>
      <text x="890" y="160" text-anchor="middle" font-size="12.5" opacity=".85" fill="#1d2126">Granola · Slack</text>
      <text x="890" y="182" text-anchor="middle" font-size="12.5" opacity=".85" fill="#1d2126">Google Drive</text>
      <text x="890" y="322" text-anchor="middle" font-size="11" opacity=".7" fill="#1d2126">your own sign-in;</text>
      <text x="890" y="338" text-anchor="middle" font-size="11" opacity=".7" fill="#1d2126">no passwords kept</text>
      <path d="M818 200 L762 200" stroke="#1d2126" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
      <text x="790" y="192" text-anchor="middle" font-size="11.5" fill="#1d2126">reads live</text>
      <!-- links back to the tools -->
      <path d="M542 70 L818 70" stroke="#1d2126" stroke-width="1.3" stroke-dasharray="4 4" fill="none" marker-end="url(#arr)"/>
      <text x="612" y="62" text-anchor="middle" font-size="11.5" fill="#1d2126">link to its CRM record</text>
      <path d="M542 335 C 640 372, 740 372, 818 335" stroke="#1d2126" stroke-width="1.3" stroke-dasharray="4 4" fill="none" marker-end="url(#arr)"/>
      <text x="680" y="384" text-anchor="middle" font-size="11.5" fill="#1d2126">link to its source</text>
      <!-- 4 workflows -->
      <rect x="20" y="412" width="940" height="92" rx="10" fill="#8a4fbf" fill-opacity=".12" stroke="#8a4fbf" stroke-width="1.5"/>
      <text x="490" y="438" text-anchor="middle" font-size="15" font-weight="600" fill="#8a4fbf">4 · Workflows</text>
      <text x="490" y="460" text-anchor="middle" font-size="12.5" fill="#1d2126">a skill is one sitting of work (define ICP, strategy, voice, deep dive)</text>
      <text x="490" y="479" text-anchor="middle" font-size="12.5" fill="#1d2126">a workflow is skills in sequence, with gates between the steps; a person, a schedule or a save starts it</text>
      <text x="490" y="496" text-anchor="middle" font-size="12" opacity=".75" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#1d2126">workflows/ · skills</text>
      <path d="M115 362 L115 408" stroke="#4c5bd4" stroke-width="1.6" fill="none" marker-end="url(#arrC)"/>
      <text x="125" y="386" text-anchor="start" font-size="11.5" fill="#1d2126">rules bind every step</text>
      <path d="M440 410 L440 364" stroke="#8a4fbf" stroke-width="1.6" fill="none" marker-end="url(#arrW)"/>
      <text x="432" y="400" text-anchor="end" font-size="11.5" fill="#1d2126">each step saved as a note</text>
      <path d="M500 362 L500 408" stroke="#8a4fbf" stroke-width="1.4" stroke-dasharray="4 4" fill="none" marker-end="url(#arrW)"/>
      <text x="510" y="400" text-anchor="start" font-size="11.5" fill="#1d2126">a save or schedule starts one</text>
      <path d="M690 410 L690 262" stroke="#8a4fbf" stroke-width="1.6" fill="none" marker-end="url(#arrW)"/>
      <text x="700" y="300" text-anchor="start" font-size="11.5" fill="#1d2126">runs through</text><text x="700" y="314" text-anchor="start" font-size="11.5" fill="#1d2126">Codex</text>
    </svg>
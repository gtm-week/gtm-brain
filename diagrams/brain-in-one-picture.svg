<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 860" role="img" aria-labelledby="t d">
<title id="t">A GTM Brain in one picture</title><desc id="d">At the top, you in a Codex chat: you say what happened, ask, and shape the brain. Below, your brain, a folder of plain files in git on your computer, in three parts side by side: memories (dated notes with sources), configuration (rules and schema first, then the base documents) and entities (people, companies and products with their relationships). Workflows and your own skills sit under them. At the bottom: your connected tools, synced in with sources; the dashboard, which shows the same files; and your team, which shares the folder through git. Only the owner changes the configuration; others propose and the owner approves.</desc>
<defs><marker id="a5d6670" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5d6670"/></marker><marker id="ab03a5b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b03a5b"/></marker><marker id="a1f8a6a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f8a6a"/></marker><marker id="ac27a12" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c27a12"/></marker><marker id="a4c5bd4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4c5bd4"/></marker></defs>

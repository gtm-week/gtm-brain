<text x="36" y="74" font-size="13.5" font-weight="400" fill="#5d6670" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">You talk to Codex. Codex keeps what matters in plain files that are yours, and reads them before it answers.</text>
